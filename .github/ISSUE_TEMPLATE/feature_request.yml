name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the moment you wished this existed, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried or considered instead?
  - type: markdown
    attributes:
      value: |
        Echo is currently in a polish-and-launch phase, so new features are weighed against
        shipping. A request is still useful: it is how the roadmap gets its evidence.
