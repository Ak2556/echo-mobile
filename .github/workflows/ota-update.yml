name: OTA Updates

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'src/**'
      - 'components/**'
      - 'package.json'
      - 'app.json'

jobs:
  update:
    name: Publish EAS Update
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Setup repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v3
        with:
          # 22, not 20, because eas-cli pulls @oclif/plugin-autocomplete, which
          # requires node >= 22. This workflow failed silently on every run from
          # at least 2026-08-30 to 2026-09-04 — testers received no OTA update
          # for five days — because the install step died before `eas update`
          # ever ran. The other workflows stay on 20 to match local dev; only
          # this one installs eas-cli.
          node-version: 22

      - name: 🏗 Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      # --environment is required for EAS to inject EXPO_PUBLIC_* variables into
      # the bundle. Without it the publish still succeeds, but EXPO_PUBLIC_SUPABASE_URL
      # resolves to undefined and lib/supabase.ts silently falls back to
      # `https://placeholder.supabase.co` — an update that boots and then fails
      # every request.
      - name: 🚀 Publish Update
        run: eas update --branch preview --environment preview --message "Automated OTA update from CI ($GITHUB_SHA)" --non-interactive
