name: Android Beta Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Least privilege: these jobs only read the repository; the secrets they use are their own.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DISABLE_AUTO_UPLOAD: ${{ secrets.SENTRY_AUTH_TOKEN == '' && 'true' || 'false' }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # The update runtime this APK carries must be the one `eas update` computes from a
      # clean checkout, or no over-the-air fix ever reaches it: the CI-built website APK
      # carried a different runtime on every build (fa067f43, 6926afc8, b2c8b19e), none of
      # them the one a clean checkout computes. expo-updates lets the build take its runtime
      # from EXPO_UPDATES_FINGERPRINT_OVERRIDE instead of computing it again inside Gradle,
      # so it is computed here, before prebuild, and handed on. Every input is printed so a
      # difference from a local `npx expo-updates fingerprint:generate --platform android`
      # can be found by diffing the two. Fails closed: a build that cannot state its runtime
      # would be unreachable again.
      - name: Pin the update runtime to the clean-checkout fingerprint
        run: |
          npx expo-updates fingerprint:generate --platform android > "$RUNNER_TEMP/fingerprint.json"
          hash=$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/fingerprint.json', 'utf8')).hash")
          if ! echo "$hash" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Could not compute the update fingerprint (got '$hash'). An APK without a known runtime cannot receive updates."
            exit 1
          fi
          node -e "for (const s of JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/fingerprint.json', 'utf8')).sources) console.log((s.hash || '').slice(0, 10), s.type, s.id || s.filePath || s.name || '')"
          echo "EXPO_UPDATES_FINGERPRINT_OVERRIDE=$hash" >> "$GITHUB_ENV"
          echo "Update runtime pinned to $hash"

      - name: Expo Prebuild
        run: npx expo prebuild --platform android

      # After prebuild, so nothing regenerating android/ can clobber the file.
      # It must exist before Gradle *configures*, because
      # plugins/withAndroidReleaseSigning.js resolves ECHO_UPLOAD_STORE_FILE at
      # configure time and throws if the path is missing.
      #
      # Fails closed on purpose. Without this secret the build would still
      # succeed and produce an APK signed with Expo's shared debug key — the
      # exact artifact that shipped on downloadecho.com, which anyone holding a
      # stock Expo checkout can forge an update over. A red build is cheaper.
      - name: Decode the upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_UPLOAD_KEYSTORE_BASE64 is not set. Refusing to build a release APK that would be signed with the shared Android debug key."
            exit 1
          fi
          mkdir -p android/app
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 -d > android/app/upload.keystore
          # A truncated or mis-pasted secret decodes to bytes keytool cannot
          # open, which Gradle would otherwise report as a generic signing error.
          if ! keytool -list -keystore android/app/upload.keystore -storepass "$ANDROID_UPLOAD_STORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::The decoded keystore could not be opened. Check ANDROID_UPLOAD_KEYSTORE_BASE64 and ANDROID_UPLOAD_STORE_PASSWORD."
            exit 1
          fi
          echo "Upload keystore decoded and opened."

      - name: Inject Fastlane Scripts
        run: |
          mv fastlane_android android/fastlane

      - name: Configure Gradle Memory
        run: echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Fastlane
        run: bundle install

      # Build only. Distribution is a separate step below, because the signature
      # has to be judged before the APK reaches anybody — the previous single
      # step uploaded to Firebase and only then would have been checked.
      - name: Build the release APK
        working-directory: android
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_CLOUDFLARE_WORKER_URL: ${{ secrets.EXPO_PUBLIC_CLOUDFLARE_WORKER_URL }}
          # Gradle picks ORG_GRADLE_PROJECT_<name> up as a project property, so
          # the passwords never land in gradle.properties where a stray commit
          # or an uploaded build log would expose them.
          ORG_GRADLE_PROJECT_ECHO_UPLOAD_STORE_FILE: app/upload.keystore
          ORG_GRADLE_PROJECT_ECHO_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_ECHO_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_ECHO_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: bundle exec fastlane build

      # The gate. Everything above is configuration, which can silently regress:
      # prebuild regenerates build.gradle from an Expo template that hardcodes
      # `release { signingConfig signingConfigs.debug }`, so the only durable
      # check is on the finished artifact.
      #
      # Runs before Firebase and before the artifact upload, so a debug-signed
      # APK reaches neither testers nor the downloads bucket. The reasoning and
      # the fingerprint live in the script.
      - name: Refuse to publish a debug-signed APK
        run: ./scripts/verify-apk-signer.sh android/app/build/outputs/apk/release/app-release.apk

      # Judges the finished artifact, like the signer check: the override above only works if
      # Gradle actually received it, and nothing else would notice if it did not.
      - name: Check the APK carries the pinned update runtime
        run: |
          embedded=$(unzip -p android/app/build/outputs/apk/release/app-release.apk assets/fingerprint)
          echo "embedded: $embedded"
          echo "pinned:   $EXPO_UPDATES_FINGERPRINT_OVERRIDE"
          if [ "$embedded" != "$EXPO_UPDATES_FINGERPRINT_OVERRIDE" ]; then
            echo "::error::The APK carries runtime '$embedded', not the pinned '$EXPO_UPDATES_FINGERPRINT_OVERRIDE'. Over-the-air updates would not reach it."
            exit 1
          fi

      - name: Distribute to Firebase
        working-directory: android
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: |
          if [ -n "$FIREBASE_CREDENTIALS" ]; then
            echo "$FIREBASE_CREDENTIALS" > firebase_credentials.json
            export GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/firebase_credentials.json
          fi
          bundle exec fastlane distribute || echo "Firebase distribution failed; the verified APK is still uploaded as an artifact."

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: echo-android-beta
          path: android/app/build/outputs/apk/release/app-release.apk
