name: Echo Healthcheck

# Runs every 15 minutes against production endpoints. If any check fails
# the workflow opens (or updates) a GitHub Issue tagged `incident` so the
# team gets a paged-on-call signal even when we're not actively watching
# the status pages.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  ping:
    runs-on: ubuntu-latest
    outputs:
      supabase_ok: ${{ steps.supabase.outputs.ok }}
      worker_ok: ${{ steps.worker.outputs.ok }}
      functions_ok: ${{ steps.functions.outputs.ok }}
      legal_ok: ${{ steps.legal.outputs.ok }}
      crons_ok: ${{ steps.crons.outputs.ok }}
      failure_summary: ${{ steps.summary.outputs.text }}
    steps:
      - name: Ping Supabase REST
        id: supabase
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -o pipefail
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ]; then
            echo "ok=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: $EXPO_PUBLIC_SUPABASE_ANON_KEY" \
            "${EXPO_PUBLIC_SUPABASE_URL%/}/rest/v1/" || echo "000")
          echo "Supabase REST -> $code"
          if [ "$code" = "200" ] || [ "$code" = "401" ] || [ "$code" = "404" ]; then
            # 401/404 still means the server is up and routing — only
            # network errors / 5xx are real failures here.
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      # The FastAPI check that used to live here was removed. The service it
      # pinged was deleted, so it failed every 15 minutes from 2026-08-15 and
      # appended 439 comments to one incident issue before anyone noticed —
      # which is worse than having no alerting at all, because it trained the
      # only alarm we have to be ignorable.
      #
      # What replaced it is the rule for anything added here: check things that
      # can plausibly break and that we would want waking up for. A check that
      # cannot fail is noise; a check that always fails is worse.

      - name: Ping the media worker
        id: worker
        env:
          EXPO_PUBLIC_CLOUDFLARE_WORKER_URL: ${{ secrets.EXPO_PUBLIC_CLOUDFLARE_WORKER_URL }}
        run: |
          set -o pipefail
          if [ -z "$EXPO_PUBLIC_CLOUDFLARE_WORKER_URL" ]; then
            echo "::warning::EXPO_PUBLIC_CLOUDFLARE_WORKER_URL is not set — media delivery is unmonitored"
            echo "ok=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A real bucket with a key that will never exist: this exercises
          # routing AND the R2 binding, and a healthy worker answers 404. An
          # unbound or broken worker throws, which surfaces as 5xx or 000 —
          # so only those count as down. Hitting an unrouted path instead
          # would 404 even on a completely misconfigured worker.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
            "${EXPO_PUBLIC_CLOUDFLARE_WORKER_URL%/}/media/echo-media/__healthcheck__" || echo "000")
          echo "media worker -> $code"
          if [ "$code" != "000" ] && [ "$code" -lt 500 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ping an edge function
        id: functions
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
        run: |
          set -o pipefail
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ]; then
            echo "ok=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # CORS preflight needs no credentials and no quota, so this tells us
          # the function runtime is serving without spending an AI request.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 -X OPTIONS \
            "${EXPO_PUBLIC_SUPABASE_URL%/}/functions/v1/voice-command" || echo "000")
          echo "edge function OPTIONS -> $code"
          if [ "$code" != "000" ] && [ "$code" -lt 500 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the public legal pages
        id: legal
        run: |
          set -o pipefail
          # Both stores require a publicly reachable privacy policy. If this
          # 404s, the listing is out of compliance and a resubmission can be
          # rejected without anything in the app having changed.
          code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 15 \
            "https://downloadecho.com/privacy" || echo "000")
          echo "privacy policy -> $code"
          if [ "$code" = "200" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check scheduled jobs
        id: crons
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -o pipefail
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ]; then
            echo "ok=skipped" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # cron_health() checks both that each job succeeded recently and that
          # pg_net has no failing responses — pg_cron reports success for a job
          # that ran and did nothing, which is how personalized-fanout stayed
          # dead for weeks while looking healthy.
          body=$(curl -s --max-time 20 -X POST \
            "${EXPO_PUBLIC_SUPABASE_URL%/}/rest/v1/rpc/cron_health" \
            -H "apikey: $EXPO_PUBLIC_SUPABASE_ANON_KEY" \
            -H 'Content-Type: application/json' -d '{}' || echo '')
          echo "cron_health -> $body"
          # One line on purpose: a multi-line python -c inside a YAML block
          # scalar dedents to column 0, which ends the block and makes YAML read
          # "try:" as a top-level key — it breaks the whole workflow file, not
          # just this step.
          n=$(printf '%s' "$body" | python3 -c "import json,sys; print(json.load(sys.stdin)[0]['unhealthy'])" 2>/dev/null || echo -1)
          if [ "$n" = "0" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            # -1 means the call itself failed to parse, which is also not healthy.
            echo "detail=$body" >> "$GITHUB_OUTPUT"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build failure summary
        id: summary
        run: |
          parts=""
          if [ "${{ steps.supabase.outputs.ok }}" = "false" ]; then
            parts="${parts}- Supabase REST is failing\n"
          fi
          if [ "${{ steps.worker.outputs.ok }}" = "false" ]; then
            parts="${parts}- Cloudflare media worker is failing — images and video will not load\n"
          fi
          if [ "${{ steps.functions.outputs.ok }}" = "false" ]; then
            parts="${parts}- Supabase edge functions are failing — voice, chat and translation are down\n"
          fi
          if [ "${{ steps.legal.outputs.ok }}" = "false" ]; then
            parts="${parts}- downloadecho.com/privacy is not reachable — store listings require it\n"
          fi
          if [ "${{ steps.crons.outputs.ok }}" = "false" ]; then
            parts="${parts}- Scheduled jobs unhealthy: ${{ steps.crons.outputs.detail }}\n"
          fi
          {
            echo "text<<EOF"
            printf "%b" "$parts"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  open_issue_on_failure:
    needs: ping
    if: ${{ needs.ping.outputs.supabase_ok == 'false' || needs.ping.outputs.worker_ok == 'false' || needs.ping.outputs.functions_ok == 'false' || needs.ping.outputs.legal_ok == 'false' || needs.ping.outputs.crons_ok == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Open / update incident issue
        uses: actions/github-script@v7
        env:
          SUMMARY: ${{ needs.ping.outputs.failure_summary }}
        with:
          script: |
            // Updates the issue body rather than commenting on it. The previous
            // version commented on every failing run — every fifteen minutes,
            // which reached 439 comments on one issue across twenty-two days of
            // a check that was pinging a service that no longer existed. A
            // persistent failure should be one issue that stays current, not a
            // stream that teaches you to mute the label.
            const title = '🚨 Healthcheck failure — production endpoints unhealthy';
            const now = new Date().toISOString();
            const summary = process.env.SUMMARY || '(no detail)';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'incident,healthcheck',
              per_page: 5,
            });

            const firstSeen = existing.length > 0
              ? (existing[0].body?.match(/First detected: (\S+)/)?.[1] ?? existing[0].created_at)
              : now;

            const body =
              `Automated healthcheck is failing.\n\n` +
              `**Currently failing:**\n${summary}\n\n` +
              `First detected: ${firstSeen}\n` +
              `Last checked: ${now}\n\n` +
              `Latest run: ${runUrl}\n\n` +
              `Runbook: docs/runbook/monitoring.md\n\n` +
              `_This body is rewritten on each failing run. If the failure is expected ` +
              `and will not be fixed soon, fix or remove the check rather than closing ` +
              `this issue — a check you have learned to ignore is worse than no check._`;

            if (existing.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['incident', 'healthcheck'],
              });
            }

  close_issue_on_recovery:
    needs: ping
    if: ${{ needs.ping.outputs.supabase_ok != 'false' && needs.ping.outputs.worker_ok != 'false' && needs.ping.outputs.functions_ok != 'false' && needs.ping.outputs.legal_ok != 'false' && needs.ping.outputs.crons_ok != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Close the incident once everything is healthy
        uses: actions/github-script@v7
        with:
          script: |
            // Without this, a recovered incident stays open until someone
            // notices, and an issue that is open when nothing is wrong is the
            // same false signal in a slower form.
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'incident,healthcheck',
              per_page: 10,
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `All checks healthy again as of ${new Date().toISOString()}. Closing automatically.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed',
              });
            }
