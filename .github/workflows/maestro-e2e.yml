name: Android E2E Tests (Maestro)

# WHAT CHANGED AND WHY (2026-08-23)
#
# This workflow had never passed. Three things were wrong:
#
#   1. It built with `expo run:android`, which builds AND installs AND launches
#      on a device. GitHub runners have no device, so it died at
#      "No Android connected device found" before any test ran. Building an APK
#      does not need a device — prebuild + `gradlew assembleDebug` does it.
#
#   2. It uploaded to Maestro Cloud using MAESTRO_CLOUD_API_KEY, a secret that
#      is not configured on this repository. Even with a working build, the
#      step would have failed. Maestro now runs locally on a CI emulator, which
#      needs no account.
#
#   3. It pointed at .maestro/smoke-test.yaml, which was fiction: it declared
#      appId com.echo.app (the real id is com.ak2556.echo, so the app could
#      never launch) and drove a password login screen that does not exist —
#      Echo signs in with a one-time code. That file has been deleted.
#
#   4. It built the debug variant. With expo-dev-client installed, a debug APK
#      boots into the dev launcher and waits for Metro, so in CI the app never
#      renders itself at all — the first run that got this far showed
#      "Development Build / Start a local development server" until the
#      assertion timed out. Release builds bundle the JS and launch standalone.
#
# The flow it runs now asserts only what is true on a fresh install, because CI
# cannot complete an OTP sign-in. See e2e/ci-launch.yaml.

on:
  pull_request:
    branches: [main]
    paths:
      # Skip the ~20 minute Android build for changes that cannot affect it.
      - 'app/**'
      - 'components/**'
      - 'src/**'
      - 'lib/**'
      - 'constants/**'
      - 'assets/**'
      - 'e2e/**'
      - 'app.json'
      - 'app.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/maestro-e2e.yml'
  workflow_dispatch:

concurrency:
  group: maestro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Maestro E2E
    runs-on: ubuntu-latest
    # The release build alone is ~31 minutes here, and android-beta.yml — same
    # runner, same release APK — took 38. 45 left nothing for booting an
    # emulator and running the flow, so a green build would still have timed
    # out. The Gradle cache does not survive a failed job, so assume cold.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # android/ is gitignored prebuild output, so it has to be generated here.
      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: '1'

      # Expo generates `org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m`.
      # That is not enough to package this app: the first run to get past the
      # device error compiled everything and then died after 31 minutes with
      #
      #   java.lang.OutOfMemoryError: Java heap space
      #     at com.android.zipflinger.Compressor.deflate
      #     at com.android.builder.internal.packaging.ApkFlinger
      #
      # zipflinger deflates each entry through an in-memory buffer, and the
      # release APK is ~190 MB. android-beta.yml already raises this; the same
      # gap here cost a full build every time. The last value in the file wins,
      # so appending overrides the generated one. Runners have 16 GB.
      - name: Configure Gradle memory
        run: echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g" >> android/gradle.properties

      # Release, not debug. expo-dev-client makes a debug APK boot into the
      # dev launcher and wait for a Metro server, which CI does not run — the
      # app just sits on "Start a local development server" forever. A release
      # build bundles the JS, so it launches standalone. React Native's Gradle
      # template signs release with the debug keystore, so this needs no
      # secrets.
      # lintVital is a release-only lint gate, and it crashes here before it
      # checks anything: "Can't initialize detector TranslationDetector …
      # this is a bug in lint or one of the libraries it depends on". It fails
      # inside react-native-async-storage and expo-modules-core — third-party
      # modules, not our source — so there is no finding to fix, and it is
      # scoped to the AGP/JDK pair the runner provides.
      #
      # We want an APK to drive a UI test, not a lint report. Excluding the
      # task keeps that failure from masking real E2E results; `npm run lint`
      # in the quality job is what actually guards our code.
      - name: Assemble release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease
        working-directory: android
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          # The Sentry Gradle plugin uploads source maps on release builds and
          # fails the build without an auth token. CI does not need symbolicated
          # stack traces, and eas.json already sets this for preview builds.
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # `target: default` is an AOSP image, deliberately. On google_apis the run
      # failed with "Pixel Launcher isn't responding" filling the screen — the
      # launcher ANR'd under software rendering while Play services were still
      # starting, so the app never came to the foreground and the flow failed on
      # an assertion that had nothing to do with the app. AOSP ships neither
      # Pixel Launcher nor GMS.
      #
      # Nothing in the cold-launch path needs Play services: push registration
      # is only called from signed-in surfaces, and there is no
      # googleServicesFile, so FCM is not configured on this build regardless.
      # If a future flow signs in with Google, it will need google_apis back.
      #
      # pixel_2 over pixel_6 for the same reason — fewer pixels to render in
      # software is less for a headless emulator to do.
      - name: Run Maestro on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          disable-animations: true
          disable-spellchecker: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: |
            # The action returns once the emulator answers adb, which is earlier
            # than the system being settled. Installing and driving the UI while
            # package manager and the launcher are still starting is what
            # produced the ANR.
            adb wait-for-device
            timeout 300 adb shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 2; done'
            timeout 120 adb shell 'while [ -n "$(pm path android 2>/dev/null; echo)" ] && ! pm list packages >/dev/null 2>&1; do sleep 2; done' || true
            sleep 15

            adb shell input keyevent KEYCODE_WAKEUP || true
            adb shell wm dismiss-keyguard || true

            adb install -r android/app/build/outputs/apk/release/app-release.apk
            maestro test e2e/ci-launch.yaml --format junit --output maestro-report.xml

      # Screenshots and the Maestro log are the only way to tell a real UI
      # regression from a flaky emulator, so keep them either way.
      - name: Upload Maestro artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results
          path: |
            maestro-report.xml
            e2e/shots/
            ~/.maestro/tests/
          if-no-files-found: ignore
          retention-days: 14
