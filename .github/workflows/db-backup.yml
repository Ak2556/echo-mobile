name: Database Backup

# Supabase takes its own backups, but they are short-retention and tied to the
# account. This one is ours: if the account is lost or suspended, or a migration
# destroys data, this file is the recovery path. See docs/runbook/monitoring.md.
#
# Without the secrets it does not fail (a workflow that fails every night
# until someone does manual setup teaches you to ignore the notifications),
# but it keeps one "Database backups are not configured" issue open, so
# having no backups is never silent. A warning in a run log nobody opens was.
#
# Every dump is restored into a throwaway Postgres and checked before it is
# uploaded. A backup that has never been restored is a hope, not a backup.
#
# Required repository secrets:
#   SUPABASE_DB_URL        Project Settings > Database > Connection string (URI)
#   R2_ACCOUNT_ID          Cloudflare account id
#   R2_ACCESS_KEY_ID       R2 API token, scoped to the echo-backups bucket only
#   R2_SECRET_ACCESS_KEY   its secret
#
# SUPABASE_DB_URL is the most powerful secret in this repository. It is here
# because a solo operator with no backup has no recovery, and that is the larger
# risk. Scope the R2 token to one bucket, and rotate the database URL if this
# repository is ever made public.

on:
  schedule:
    - cron: '15 20 * * *'   # 01:45 IST
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  dump:
    runs-on: ubuntu-latest
    services:
      restore:
        # pgvector: public_echoes.embedding is vector(768), and a table that fails
        # to create restores no rows.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: restore
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Check configuration
        id: config
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          missing=""
          [ -z "$SUPABASE_DB_URL" ]      && missing="$missing SUPABASE_DB_URL"
          [ -z "$R2_ACCOUNT_ID" ]        && missing="$missing R2_ACCOUNT_ID"
          [ -z "$R2_ACCESS_KEY_ID" ]     && missing="$missing R2_ACCESS_KEY_ID"
          [ -z "$R2_SECRET_ACCESS_KEY" ] && missing="$missing R2_SECRET_ACCESS_KEY"
          if [ -n "$missing" ]; then
            echo "::warning::Database backups are NOT running. Missing secrets:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install postgresql-client 17
        if: steps.config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump
        if: steps.config.outputs.ready == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          name="echo-$(date -u +%Y-%m-%d).sql.gz"
          # --no-owner/--no-acl because the target of a real restore is a fresh
          # project whose roles differ from this one's.
          pg_dump "$SUPABASE_DB_URL" --no-owner --no-acl --clean --if-exists | gzip -9 > "$name"
          size=$(stat -c%s "$name")
          echo "$name is $size bytes"
          # A dump that is suspiciously small is a failed dump that exited 0 —
          # the shape of silent data loss, so treat it as a hard failure.
          if [ "$size" -lt 50000 ]; then
            echo "::error::dump is only $size bytes — treating as a failure"
            exit 1
          fi
          echo "NAME=$name" >> "$GITHUB_ENV"

      # Supabase-only extensions and roles do not exist in plain Postgres, so
      # those statements are allowed to fail; the check is that the data came
      # back. Row counts, not table counts: an empty schema restores cleanly.
      - name: Prove the dump restores
        if: steps.config.outputs.ready == 'true'
        env:
          RESTORE_URL: postgresql://postgres:restore@localhost:5432/postgres
        run: |
          set -euo pipefail
          gunzip -c "$NAME" | psql "$RESTORE_URL" -q -v ON_ERROR_STOP=0 >/dev/null 2>restore.err || true
          profiles=$(psql "$RESTORE_URL" -tA -c "select count(*) from public.profiles" 2>/dev/null || echo 0)
          echoes=$(psql "$RESTORE_URL" -tA -c "select count(*) from public.public_echoes" 2>/dev/null || echo 0)
          echo "restored: profiles=$profiles public_echoes=$echoes"
          if [ "$profiles" -lt 1 ] || [ "$echoes" -lt 1 ]; then
            echo "::error::the dump did not restore: profiles=$profiles public_echoes=$echoes"
            tail -20 restore.err
            exit 1
          fi

      - name: Upload to R2 and prune past 30 days
        if: steps.config.outputs.ready == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ACCOUNT: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          endpoint="https://${ACCOUNT}.r2.cloudflarestorage.com"
          aws s3 cp "$NAME" "s3://echo-backups/db/$NAME" --endpoint-url "$endpoint"
          # Retention lives here rather than in a bucket lifecycle rule so the
          # policy is visible next to the thing it deletes.
          cutoff=$(date -u -d '30 days ago' +%Y-%m-%d)
          aws s3 ls "s3://echo-backups/db/" --endpoint-url "$endpoint" | awk '{print $4}' | while read -r f; do
            d=$(echo "$f" | sed -n 's/^echo-\([0-9-]\{10\}\)\.sql\.gz$/\1/p')
            if [ -n "$d" ] && [ "$d" \< "$cutoff" ]; then
              aws s3 rm "s3://echo-backups/db/$f" --endpoint-url "$endpoint"
            fi
          done

      - name: Keep one issue open while backups are not configured
        if: steps.config.outputs.ready != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Database backups are not configured';
            const body =
              `The nightly backup is not running: its secrets are missing.\n\n` +
              `Last checked: ${new Date().toISOString()}\n\n` +
              `Set SUPABASE_DB_URL, R2_ACCOUNT_ID, R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY ` +
              `(see the header of .github/workflows/db-backup.yml). This issue closes itself ` +
              `after the first successful backup.`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'backup,unconfigured', per_page: 5,
            });
            if (open.length > 0) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: open[0].number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['backup', 'unconfigured'] });
            }

      - name: Close backup issues after a successful backup
        if: success() && steps.config.outputs.ready == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            for (const labels of ['backup,unconfigured', 'incident,backup']) {
              const { data: open } = await github.rest.issues.listForRepo({
                owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels, per_page: 10,
              });
              for (const issue of open) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number,
                  body: `Backed up and restore-checked at ${new Date().toISOString()}. Closing automatically.`,
                });
                await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, state: 'closed' });
              }
            }

      - name: Report a backup failure
        if: failure() && steps.config.outputs.ready == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            // Reuses one open issue rather than creating one per night, for the
            // same reason the healthcheck stopped commenting: a nightly job that
            // files a nightly issue is a nightly notification you will mute.
            const title = 'Database backup failing';
            const body =
              `The nightly dump did not complete.\n\n` +
              `Last failure: ${new Date().toISOString()}\n` +
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
              `Runbook: docs/runbook/monitoring.md`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'incident,backup', per_page: 5,
            });
            if (open.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['incident', 'backup'],
              });
            }
