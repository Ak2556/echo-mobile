# THROWAWAY — the runner has no ffmpeg, so this measures what installing it
# costs per run and confirms the encoders/muxers the ladder needs.
name: _probe ffmpeg
on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install ffmpeg (static build action)
        id: setup
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Capabilities and a real encode
        run: |
          echo "--- version ---"
          ffmpeg -hide_banner -version | head -2
          echo "--- encoders ---"
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -E " libx264| aac " || echo "MISSING ENCODER"
          echo "--- hls muxer ---"
          ffmpeg -hide_banner -muxers 2>/dev/null | grep -E " hls" || echo "MISSING HLS MUXER"
          echo "--- real 60s 720p -> 3-rung HLS, timed ---"
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=30:duration=60 \
                 -f lavfi -i sine=frequency=440:duration=60 \
                 -c:v libx264 -preset veryfast -crf 24 -c:a aac -b:a 64k -ac 1 -y src.mp4
          echo "source: $(du -h src.mp4 | cut -f1)"
          time ( \
            for h in 360 540 720; do \
              mkdir -p out/${h}p; \
              ffmpeg -hide_banner -loglevel error -i src.mp4 \
                -vf scale=-2:$h -c:v libx264 -preset veryfast -crf 25 -c:a aac -b:a 64k -ac 1 \
                -f hls -hls_time 4 -hls_playlist_type vod \
                -hls_segment_filename out/${h}p/seg_%05d.ts out/${h}p/index.m3u8; \
            done )
          echo "--- output ---"
          du -sh out/*; ls out/360p | head -3
