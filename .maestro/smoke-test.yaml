appId: com.echo.app
---
- launchApp:
    clearState: true

# 1. Onboarding / Welcome Screen
- assertVisible: "Welcome to Echo"
- tapOn: "Get Started"

# 2. Login Flow
- assertVisible: "Phone Number"
- tapOn: "Continue with Email instead"
- tapOn: "Email address"
- inputText: "test-e2e@echo.app"
- tapOn: "Password"
- inputText: "securePassword123"
- tapOn: "Sign In"

# 3. Verify Feed Load
- assertVisible: "Home"
- assertVisible: "Trending"
- swipe:
    direction: DOWN

# 4. Profile Navigation
- tapOn: "Profile"
- assertVisible: "Followers"
- assertVisible: "Following"
- tapOn: "Settings"
- tapOn: "Log Out"

# 5. Verify Logout
- assertVisible: "Welcome to Echo"
