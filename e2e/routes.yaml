# Route coverage: every static screen opens by deep link and shows its title.
# Catches a screen that crashes on mount, an unmatched route, or a broken
# deep-link mapping. Read-only: create-post and delete-account are opened, not
# submitted. Assumes a signed-in release build.
# Run: maestro test e2e/routes.yaml
#
# Flag-gated screens (salons, quests, badges, office-hours, year-in-echo) are
# deliberately absent: with their flags off they redirect Home.
appId: com.downloadecho.echo
---
# Restart the app (session kept) so every flow starts clean: a previous flow
# can leave a modal or Flow's full-screen mode open, which deep links do not
# dismiss. This also exercises cold-start routing for a signed-in user.
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Explore"
    timeout: 30000

- openLink: echo://blocked-users
- extendedWaitUntil:
    visible: "Blocked Users"
    timeout: 15000
- back

- openLink: echo://muted-users
- extendedWaitUntil:
    visible: "Muted Users"
    timeout: 15000
- back

