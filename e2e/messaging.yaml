# Messaging smoke: the DM inbox loads and a real thread opens with its history.
# Non-destructive: the composer is typed into and erased, never sent.
# Assumes a signed-in release build with an existing thread with "Kav".
# Run: maestro test e2e/messaging.yaml
appId: com.downloadecho.echo
---
# Restart the app (session kept) so every flow starts clean: a previous flow
# can leave a modal or Flow's full-screen mode open, which deep links do not
# dismiss. This also exercises cold-start routing for a signed-in user.
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Explore"
    timeout: 30000

- openLink: echo://messages
- extendedWaitUntil:
    visible: "Recent conversations"
    timeout: 20000

- tapOn: "Kav"
- extendedWaitUntil:
    visible: "Back to messages"
    timeout: 15000
- assertVisible: "@kavish"

# Composer: the empty field is labelled "Aa"; typing flips the mic to Send.
- tapOn: "Aa"
- inputText: "maestro composer check"
- assertVisible: "maestro composer check"
- assertVisible: "Send message"
- eraseText: 40
- tapOn: "Back to messages"
