# Navigation smoke: the app shell loads and every bottom tab renders without
# crashing. Assumes a release build is installed and signed in.
# Run: maestro test e2e/smoke.yaml
#
# Flow (full-screen video) hides the tab bar, so it goes last.
appId: com.downloadecho.echo
---
# Restart the app (session kept) so every flow starts clean: a previous flow
# can leave a modal or Flow's full-screen mode open, which deep links do not
# dismiss. This also exercises cold-start routing for a signed-in user.
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Explore"
    timeout: 30000

- tapOn: "Explore"
# Explore keeps the last search, so assert the screen, not the topic grid.
- extendedWaitUntil:
    visible: "Explore"
    timeout: 15000
- takeScreenshot: e2e/shots/explore

- tapOn: "Chat"
- extendedWaitUntil:
    visible: "Messages"
    timeout: 15000
- takeScreenshot: e2e/shots/chat

- tapOn: "Tools"
- extendedWaitUntil:
    visible: "Open Pomodoro"
    timeout: 15000
- takeScreenshot: e2e/shots/tools

- tapOn: "You"
- extendedWaitUntil:
    visible: "Edit Profile"
    timeout: 15000
- takeScreenshot: e2e/shots/you

- tapOn: "Home"
- extendedWaitUntil:
    visible: "For You"
    timeout: 15000
- takeScreenshot: e2e/shots/home

- tapOn: "Reverb"
- extendedWaitUntil:
    visible: "Share"
    timeout: 20000
- takeScreenshot: e2e/shots/flow
