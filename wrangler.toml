# This is the config production deploys from. Do not delete it as a duplicate.
#
# Cloudflare Workers Builds deploys the echo-mobile worker from the repo root on
# every push to main, so it reads THIS file. cloudflare/wrangler.toml is what a
# hand deploy (`cd cloudflare && npx wrangler deploy`) reads, and documents the
# secrets. Removing this copy on 2026-09-04 (5ad965f) broke every build after it.
#
# The two must declare the same worker; only `main` differs, because the paths
# are relative to each file. test/wranglerConfigParity.test.ts fails if they
# drift — an older copy of this file was missing LEARN_LECTURES_BUCKET, which
# would have dropped lecture storage from production on the next deploy.

name = "echo-mobile"
main = "cloudflare/src/index.ts"
compatibility_date = "2024-03-20"

[vars]
R2_ACCOUNT_ID = "5f35370a3c9265072a8ae6c47b22dd46"

[[r2_buckets]]
binding = "AVATARS_BUCKET"
bucket_name = "avatars"

[[r2_buckets]]
binding = "ECHO_MEDIA_BUCKET"
bucket_name = "echo-media"

[[r2_buckets]]
binding = "DM_MEDIA_BUCKET"
bucket_name = "dm-media"

[[r2_buckets]]
binding = "MINI_APP_MEDIA_BUCKET"
bucket_name = "mini-app-media"

[[r2_buckets]]
binding = "MARKETPLACE_PHOTOS_BUCKET"
bucket_name = "marketplace-photos"

[[r2_buckets]]
binding = "LEARN_LECTURES_BUCKET"
bucket_name = "learn-lectures"
